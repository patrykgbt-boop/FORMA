name: FORMA Sleep Android - APK bez sklepu
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/forma-sleep-android/package.json'
      - 'mobile/forma-sleep-android/app.json'
      - 'mobile/forma-sleep-android/app.config.js'
      - 'mobile/forma-sleep-android/eas.json'
      - '.github/workflows/forma-sleep-android-apk.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    defaults:
      run:
        working-directory: mobile/forma-sleep-android
    env:
      CI: '1'
      EXPO_EAS_PROJECT_ID: '070ad17e-2d91-4253-be1f-bd0075a777de'
      EXPO_PUBLIC_SUPABASE_URL: 'https://ymemohuafzogbhgggcvm.supabase.co'
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_-3RrLnYXbVyGL7QeKgsEwg_ynhEAi7f'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install packages
        run: npm install --no-audit --fund=false
      - name: Verify Expo package versions
        run: npx expo install --check
      - name: Verify OTA configuration
        run: |
          npx expo config --json > /tmp/forma-sleep-expo-config.json
          node -e "const c=require('/tmp/forma-sleep-expo-config.json'); if(c.updates?.url!==('https://u.expo.dev/'+process.env.EXPO_EAS_PROJECT_ID)||c.extra?.eas?.projectId!==process.env.EXPO_EAS_PROJECT_ID||c.runtimeVersion!=='forma-sleep-android-runtime-1'||c.updates?.requestHeaders?.['expo-channel-name']!=='production')process.exit(1); console.log('OTA enabled for runtime',c.runtimeVersion);"
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Assemble standalone APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Confirm APK
        run: test -s android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FORMA-Sleep-Android-APK
          path: mobile/forma-sleep-android/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
          if-no-files-found: error
