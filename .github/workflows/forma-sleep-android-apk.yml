name: FORMA Sleep Android - APK bez sklepu
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/forma-sleep-android/**'
      - '.github/workflows/forma-sleep-android-apk.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    defaults:
      run:
        working-directory: mobile/forma-sleep-android
    env:
      CI: '1'
      EXPO_PUBLIC_SUPABASE_URL: 'https://ymemohuafzogbhgggcvm.supabase.co'
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_-3RrLnYXbVyGL7QeKgsEwg_ynhEAi7f'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9a683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install packages
        run: npm install --no-audit --fund=false
      - name: Align Expo packages
        run: npx expo install --fix
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Assemble standalone APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Confirm APK
        run: test -s android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FORMA-Sleep-Android-APK
          path: mobile/forma-sleep-android/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
          if-no-files-found: error
