name: FORMA Sleep Android - OTA code check
on:
  push:
    branches: [main]
    paths:
      - 'mobile/forma-sleep-android/**'
      - '.github/workflows/forma-sleep-android-ota-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile/forma-sleep-android
    env:
      CI: '1'
      EXPO_EAS_PROJECT_ID: '070ad17e-2d91-4253-be1f-bd0075a777de'
      EXPO_PUBLIC_SUPABASE_URL: 'https://ymemohuafzogbhgggcvm.supabase.co'
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_-3RrLnYXbVyGL7QeKgsEwg_ynhEAi7f'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install packages
        run: npm install --no-audit --fund=false
      - name: Align Expo versions
        run: npx expo install --fix
      - name: Check dynamic OTA configuration
        run: |
          npx expo config --json > /tmp/forma-sleep-check.json
          node -e "const c=require('/tmp/forma-sleep-check.json'); if(c.runtimeVersion!=='forma-sleep-android-runtime-1'||c.updates?.requestHeaders?.['expo-channel-name']!=='production'||c.updates?.url!==('https://u.expo.dev/'+process.env.EXPO_EAS_PROJECT_ID)) process.exit(1);"
      - name: Bundle Android JS and assets (does not publish)
        run: npx expo export --platform android --output-dir /tmp/forma-sleep-android-ota-check
